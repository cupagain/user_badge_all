<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>帳號徽章更換 | SWAG Premium</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* ── Design Tokens ───────────────────────── */
            --bg: #191919; /* Primary Theme > Surface */
            --surface-container: #232323; 
            --outline: #474747;
            
            /* Themes */
            --pink: #F6418D; /* Loverse Theme */
            --gold: #FFD100; /* Creater Theme */
            --primary: #00D2BE; /* Aquamarine */
            --info: #60C4E8; 
            --success-green: #15EA48;
            
            /* Typography */
            --font-head: 'PingFang TC', 'Outfit', sans-serif;
            --font-body: 'PingFang TC', 'Inter', sans-serif;
            
            /* Text */
            --text-primary: #FFFFFF;
            --text-secondary: #C8C8C8;
            --text-dim: #9B9B9B; /* Tertiary Inverse */
            
            /* Legacy Map */
            --glass-deep: rgba(35, 35, 35, 0.95);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg); color: var(--text-primary); font-family: var(--font-body);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 210, 190, 0.05) 0%, transparent 50%);
            min-height: 100vh; padding-bottom: 60px; overflow-x: hidden;
        }

        /* ── TOP NAV ─────────────────────────────── */
        .top-nav { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); 
            color: var(--text-dim); padding: 6px 12px; border-radius: 8px; 
            font-size: 12px; font-weight: 600; cursor: pointer; min-height: 32px;
            transition: all 0.2s;
        }
        .lang-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 700; }

        /* ── HEADER ─────────────────────────────── */
        .header-area { text-align: center; padding: 70px 20px 5px; }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        .main-title {
            font-family: var(--font-head); font-size: 30px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px;
            background: linear-gradient(90deg, #fff 0%, #C8C8C8 25%, #fff 50%, #C8C8C8 75%, #fff 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite; white-space: normal; overflow-wrap: break-word;
        }
        .username-line { font-size: 14px; font-weight: 700; color: var(--gold); margin-bottom: 20px; display: block; opacity: 0.9; }
        .minimal-total-box {
            display: inline-flex; align-items: center; gap: 10px;
            border: 1px solid rgba(96, 196, 232, 0.4); background: rgba(96, 196, 232, 0.05);
            padding: 8px 20px; border-radius: 100px; margin-bottom: 15px;
        }
        .mt-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .mt-val { font-family: var(--font-head); font-size: 18px; font-weight: 800; color: var(--info); }

        /* ── UPCOMING BANNER ─────────────────────────────── */
        .upcoming-alert-wrap { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; display: none; }
        .upcoming-banner {
            border-radius: 20px; padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            position: relative; overflow: hidden; text-decoration: none;
            background: linear-gradient(135deg, rgba(246, 65, 141, 0.12) 0%, rgba(35, 35, 35, 0.85) 100%);
            border: 1px solid rgba(246, 65, 141, 0.3);
            box-shadow: 0 0 0 1px rgba(246, 65, 141, 0.08) inset, 0 8px 20px rgba(0,0,0,0.25);
        }
        .upcoming-banner.is-locked {
            background: linear-gradient(135deg, rgba(255, 209, 0, 0.08) 0%, rgba(35, 35, 35, 0.85) 100%);
            border-color: rgba(255, 209, 0, 0.25);
            box-shadow: 0 0 0 1px rgba(255, 209, 0, 0.06) inset, 0 8px 20px rgba(0,0,0,0.25);
        }
        .upcoming-banner:active { transform: scale(0.99); opacity: 0.9; }

        .ub-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .ub-new-tag {
            font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
            padding: 3px 8px; border-radius: 6px;
            background: rgba(246, 65, 141, 0.15); color: var(--pink); border: 1px solid rgba(246, 65, 141, 0.25);
        }
        .is-locked .ub-new-tag { background: rgba(255, 209, 0, 0.12); color: var(--gold); border-color: rgba(255, 209, 0, 0.25); }

        .ub-title-row { display: flex; align-items: center; gap: 8px; }
        .ub-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--pink); box-shadow: 0 0 6px var(--pink); animation: dot-pulse 2s ease-in-out infinite; }
        .is-locked .ub-status-dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: none; }
        @keyframes dot-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .ub-event-name { font-family: var(--font-head); font-size: 17px; font-weight: 900; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ub-status-text { font-size: 12px; font-weight: 800; white-space: nowrap; color: var(--pink); }
        .is-locked .ub-status-text { color: var(--gold); }

        .ub-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ub-date { font-size: 12px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        .ub-hint { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-top: 2px; }

        .ub-images { display: flex; align-items: center; flex-shrink: 0; }
        .ub-img-stack { display: flex; align-items: center; }
        .ub-img-wrap {
            width: 50px; height: 50px; border-radius: 12px; /* Shape Token: Medium */
            background: rgba(0,0,0,0.35); border: 1.5px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            flex-shrink: 0; box-shadow: 0 3px 8px rgba(0,0,0,0.4); position: relative;
        }
        .ub-img-wrap + .ub-img-wrap { margin-left: -16px; }
        .ub-img { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
        .is-locked .ub-img { filter: grayscale(100%) opacity(0.65); }
        .ub-mystery { font-family: var(--font-head); font-size: 20px; font-weight: 900; color: var(--text-secondary); }
        .ub-chevron { color: var(--pink); font-size: 18px; margin-left: 8px; opacity: 0.8; font-weight: 700; }
        .is-locked .ub-chevron { color: var(--gold); }

        /* ── HERO & LIBRARY ──────────────────────────────── */
        .hero-banner-wrap { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; }
        .library-hero-card {
            background: linear-gradient(135deg, rgba(255, 209, 0, 0.15) 0%, rgba(255, 209, 0, 0.02) 100%);
            border: 1px solid rgba(255, 209, 0, 0.3); border-radius: 20px;
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden;
        }
        .library-hero-card:active { transform: scale(0.98); }
        .library-hero-card::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent); transform: rotate(45deg); animation: shimmer 3s infinite; pointer-events: none; }
        .lh-info { text-align: left; }
        .lh-title { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 4px; display: block; }
        .lh-desc { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .lh-count { font-family: var(--font-head); font-size: 24px; font-weight: 900; color: #fff; display: flex; align-items: baseline; gap: 4px; }
        .lh-count-text { font-size: 12px; font-weight: 600; color: var(--text-dim); font-family: var(--font-body); }
        .lh-arrow { font-size: 14px; color: var(--gold); opacity: 0.8; margin-left: 4px; }

        /* ── EVENT MODAL ───────────────────────────────────── */
        .event-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(14px);
            z-index: 25000; display: none; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; transition: opacity 0.25s; cursor: pointer;
        }
        .event-modal-overlay.show { display: flex; opacity: 1; }

        .em-content {
            background: linear-gradient(180deg, var(--surface-container) 0%, var(--bg) 100%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            width: 100%; max-width: 360px; cursor: default;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); overflow: hidden; position: relative;
        }

        .em-header { padding: 24px 20px 0; text-align: center; position: relative; }
        .em-close {
            position: absolute; right: 12px; top: 12px;
            width: 44px; height: 44px; /* Touch target > 40px */
            border-radius: 50%;
            background: rgba(255,255,255,0.06); border: none; color: var(--text-secondary);
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .em-close:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .em-status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 14px; border-radius: 100px; margin: 0;
            font-size: 13px; font-weight: 900; letter-spacing: 0.5px;
        }
        .em-status-badge.active { background: rgba(246, 65, 141, 0.15); color: var(--pink); border: 1px solid rgba(246, 65, 141, 0.3); }
        .em-status-badge.locked { background: rgba(255, 209, 0, 0.12); color: var(--gold); border: 1px solid rgba(255, 209, 0, 0.25); }
        .em-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .em-body { padding: 20px 16px; max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

        .em-badge-item {
            display: flex; align-items: center; gap: 16px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 16px;
        }
        .em-badge-img-box {
            width: 64px; height: 64px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3) inset;
        }
        .em-badge-img-box img { width: 50px; height: 50px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        .em-badge-mystery { font-family: var(--font-head); font-size: 32px; font-weight: 900; color: var(--text-secondary); }
        
        .em-badge-info { flex: 1; min-width: 0; text-align: left; }
        .em-badge-name { font-size: 17px; font-weight: 900; color: var(--gold); margin-bottom: 6px; letter-spacing: 0.5px; }
        .em-badge-rule { 
            font-size: 12.5px; 
            font-weight: 400; 
            color: var(--text-secondary); 
            line-height: 1.5; 
        }

        .em-footer { padding: 0 16px 20px; }
        .em-cta-btn {
            display: block; width: 100%; min-height: 48px;
            padding: 15px 0; border-radius: 12px;
            font-size: 16px; font-weight: 900; text-align: center; text-decoration: none;
            border: none; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s, transform 0.15s;
        }
        .em-btn-active { background: var(--pink); color: #fff; box-shadow: 0 4px 16px rgba(246, 65, 141, 0.35); }
        .em-btn-active:active { transform: scale(0.98); }
        .em-btn-disabled { background: var(--outline); color: var(--text-secondary); cursor: default; }
        /* ─────────────────────────────────────────────────── */

        /* 其他原有模塊樣式 (管理區塊/圖鑑) 保留原貌 */
        .management-section { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; }
        .management-card {
            background: var(--glass-deep); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 24px 20px; backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: border-color 0.3s;
        }
        .management-card.vip-active { border-color: rgba(255, 209, 0, 0.3); }
        .mc-header { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .mc-title { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; font-family: var(--font-head); }
        .ac-rule-top {
            font-size: 12px; color: var(--text-secondary); font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px; border-radius: 100px; margin-bottom: 2px;
        }
        .lvl-highlight { color: var(--gold); font-family: var(--font-head); font-weight: 900; font-size: 13.5px; text-shadow: 0 0 10px rgba(255, 209, 0, 0.3); }
        .equipped-grid { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
        .equipped-box {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; padding: 24px 10px 14px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            width: calc(50% - 8px); max-width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative; overflow: hidden;
            transition: opacity 0.4s, border-color 0.4s;
        }
        .equipped-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(255, 209, 0, 0.6), transparent); }
        .equipped-box::after { content: ''; position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 100px; height: 80px; background: radial-gradient(circle, rgba(255, 209, 0, 0.12) 0%, transparent 70%); pointer-events: none; }
        .equipped-box img { width: 80px; height: 80px; margin-bottom: 12px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7)); transform: scale(1.05); position: relative; z-index: 2; transition: opacity 0.3s; }
        .equipped-box span { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.2; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-shadow: 0 2px 4px rgba(0,0,0,0.6); position: relative; z-index: 2; }
        .equipped-box.pending { opacity: 0.6; border-color: rgba(255, 209, 0, 0.5); }
        .eq-loading-ring {
            position: absolute; inset: 4px; border-radius: 20px; z-index: 10;
            border: 2px solid transparent; border-top-color: var(--gold); border-right-color: rgba(255, 209, 0, 0.3);
            animation: spin 1s linear infinite; pointer-events: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes successPulse {
            0%   { box-shadow: 0 0 0 0 rgba(255,209,0,0.7), 0 10px 25px rgba(0,0,0,0.4); border-color: var(--gold); }
            50%  { box-shadow: 0 0 0 12px rgba(255,209,0,0), 0 10px 25px rgba(0,0,0,0.4); border-color: var(--gold); }
            100% { box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.08); }
        }
        .equipped-box.eq-confirmed { opacity: 1 !important; animation: successPulse 0.9s ease-out forwards; }
        .mc-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--glass-border), transparent); margin: 0 10px; }
        .mc-vip-area { display: flex; align-items: center; justify-content: space-between; padding: 0 5px; flex-wrap: wrap; gap: 12px; }
        .ac-my-lvl { font-size: 14px; font-weight: 700; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        .val-lvl-plain { font-family: var(--font-head); font-size: 22px; color: var(--gold); line-height: 1; font-weight: 900; }
        .ac-status-area { display: flex; align-items: center; gap: 12px; }
        .val-status { font-size: 14px; font-weight: 800; color: var(--text-dim); }
        .val-status.unlocked { color: var(--gold); }
        .upgrade-cta-inline { background: var(--pink); color: #fff; font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: none; box-shadow: 0 4px 10px rgba(246,65,141,0.3); white-space: nowrap; }
        
        .swap-progress-bar { display: none; align-items: center; justify-content: center; gap: 8px; padding: 10px 0 4px; font-size: 11px; font-weight: 700; color: var(--text-dim); }
        .swap-progress-bar.visible { display: flex; }
        .sp-step { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.35; transition: opacity 0.4s; }
        .sp-step.active { opacity: 1; color: var(--gold); }
        .sp-step.done { opacity: 0.6; color: var(--success-green); }
        .sp-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .sp-line { width: 24px; height: 2px; background: var(--glass-border); border-radius: 1px; align-self: center; margin-bottom: 12px; }
        .sp-line.done { background: var(--success-green); }
        
        .instruction-area { text-align: center; margin-bottom: 15px; min-height: 48px; padding: 0 20px; }
        .hint-label { font-size: 11px; font-weight: 700; color: var(--text-dim); display: block; margin-bottom: 4px; text-transform: uppercase; }
        .hint-pos-warn { font-size: 11px; font-weight: 600; color: var(--gold); opacity: 0.8; margin-top: 4px; display: block; margin-bottom: 6px; }
        .hint-value { font-size: 16px; font-weight: 800; color: #fff; display: block; }
        .hint-selected { color: var(--info); }
        
        .badge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 16px 30px; max-width: 1000px; margin: 0 auto; justify-content: center; }
        @media (min-width: 768px) { .badge-grid { grid-template-columns: repeat(auto-fit, 180px); justify-content: center; } }
        .badge-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 30px 10px 10px; text-align: center; cursor: pointer; position: relative; transition: border-color 0.3s, background 0.3s, transform 0.3s; display: flex; flex-direction: column; align-items: center; height: 100%; min-height: 160px; }
        .badge-item.selected { border-color: var(--gold); background: rgba(255, 209, 0, 0.12); transform: scale(1.02); }
        .badge-item.selected::after { content: '✓'; position: absolute; top: 12px; right: 15px; color: var(--gold); font-weight: 900; font-size: 18px; }
        .badge-img { width: 75px; height: 75px; margin-bottom: 12px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); pointer-events: none; }
        .badge-name { font-size: 14px; font-weight: 700; color: #f1f5f9; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; pointer-events: none; margin-bottom: 5px; }
        
        .inline-confirm-btn { background: var(--gold); color: #000; border: none; padding: 8px 0; width: 90%; border-radius: 8px; font-family: var(--font-head); font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 209, 0, 0.4); animation: fadeIn 0.3s ease forwards; margin-top: auto; min-height: 40px; }
        .inline-confirm-btn.submitting { opacity: 0.7; cursor: wait; filter: grayscale(0.5); }
        
        .badge-grid.lang-loading { opacity: 0.4; pointer-events: none; transition: opacity 0.2s; }
        .badge-grid.lang-loaded  { opacity: 1; transition: opacity 0.3s; }
        
        .zero-badge-hero { max-width: 600px; margin: 30px auto; padding: 40px 20px; text-align: center; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 16px; backdrop-filter: blur(10px); }
        .zero-badge-hero p { font-size: 15px; font-weight: 700; color: var(--text-dim); margin-bottom: 20px; }
        .hero-btn { background: rgba(255,255,255,0.1); color: #fff; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 700; border: 1px solid var(--glass-border); cursor: pointer; transition: background 0.3s; min-height: 40px;}
        
        .footer { max-width: 600px; margin: 40px auto 0; padding: 30px 20px 80px; border-top: 1px solid var(--glass-border); }
        .notice-list { list-style: none; padding: 0; }
        .notice-item { font-size: 12px; color: var(--text-dim); font-weight: 600; line-height: 1.6; margin-bottom: 8px; display: flex; gap: 8px; text-align: left; align-items: flex-start; }
        .notice-item::before { content: "•"; color: var(--text-dim); font-weight: 900; font-size: 16px; line-height: 1.2; flex-shrink: 0; margin-top: 1px; }
        .notice-alert { color: var(--pink) !important; font-weight: 800 !important; }
        
        .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); backdrop-filter: blur(20px); z-index: 15000; display: none; flex-direction: column; animation: fadeIn 0.2s ease; }
        .overlay-header { padding: 25px 20px 15px; text-align: center; position: relative; flex-shrink: 0; }
        .overlay-title { font-family: var(--font-head); font-size: 20px; font-weight: 900; color: #fff; }
        .close-overlay { position: absolute; right: 12px; top: 12px; font-size: 24px; color: var(--text-dim); cursor: pointer; border: none; background: none; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .close-overlay:hover { color: #fff; background: rgba(255,255,255,0.08); }

                if (secondLastId) eqList.push({ id: secondLastId, name: findNameInList(secondLastId) });
                eqList.push({ id: lastId, name: findNameInList(lastId) });
                renderEquippedGrid(eqList);
            }
            document.getElementById('ui-username-display').innerText = I18N[state.lang].username + (state.username || '---');
            if (state.list.length > 0) render();
            check();
        }

        const getCleanUserId = () => {
            const getFromUrl = (url) => {
                if (!url) return null;
                const decoded = decodeURIComponent(url);
                const match = decoded.match(/[?&](user_id|uid|userId)=([a-zA-Z0-9]{24,48})/i);
                return match ? match[2] : null;
            };
            let rawId = getFromUrl(window.location.href) || getFromUrl(document.referrer);
            if (!rawId) { const p = new URLSearchParams(window.location.search); const s = p.get('source'); if (s) rawId = getFromUrl(s); }
            if (!rawId) return null;
            return rawId.length >= 48 ? rawId.substring(12, rawId.length - 12) : rawId;
        };
        const uid = getCleanUserId();

        function showModal(msg) { document.getElementById('modal-msg').innerText = msg; document.getElementById('custom-modal').classList.add('show'); }
        function closeModal() { document.getElementById('custom-modal').classList.remove('show'); }
        function handleModalBackdrop(e) { if (e.target === document.getElementById('custom-modal')) closeModal(); }

        const isInIframe = window.self !== window.top;

        function setupPwaLinkInterceptor() {
            if (!isInIframe) return;
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a[target="_blank"]');
                if (!link) return;
                try {
                    const url = new URL(link.href);
                    if (url.hostname === 'swag.live' || url.hostname === 'www.swag.live') {
                        e.preventDefault();
                        window.parent.postMessage({ type: 'PWA_NAVIGATE', url: link.href }, 'https://swag.live');
                    }
                } catch (err) { console.warn('URL parsing error:', err); }
            });
        }

        function openEventModal(eventId) {
            const evt = UPCOMING_BADGE_DB.find(e => e.id === eventId);
            if (!evt) return;

            const now = new Date();
            const start = new Date(evt.startDate);
            const end   = new Date(evt.endDate + 'T23:59:59');
            const isActive = now >= start && now <= end;
            const daysUntil = Math.ceil((start - now) / 86400000);
            const t = I18N[state.lang];
            const info = evt.langs[state.lang] || evt.langs['zh-hant'];

            const statusBadge = document.getElementById('em-status-badge');
            const statusText  = document.getElementById('em-status-text');
            if (isActive) {
                statusBadge.className = 'em-status-badge active';
                statusText.textContent = t.uc_active;
            } else {
                statusBadge.className = 'em-status-badge locked';
                statusText.textContent = daysUntil > 0 ? t.uc_days_pre + daysUntil + t.uc_days_suf : t.uc_soon;
            }

            const section = document.getElementById('em-badge-container');
            let html = `<div class="em-section-label">${t.em_badge_section}</div>`;
            evt.badges.forEach(b => {
                const imgHtml = b.preview
                    ? `<img src="${CFG.img}${b.imgId}.svg" onerror="handleImgFallback(this)">`
                    : `<div class="em-badge-mystery">?</div>`;
                html += `
                    <div class="em-badge-item">
                        <div class="em-badge-img-box">${imgHtml}</div>
                        <div class="em-badge-info">
                            <div class="em-badge-name"></div>
                            <div class="em-badge-rule" title=""></div>
                        </div>
                    </div>`;
            });
            section.innerHTML = html;

            section.querySelectorAll('.em-badge-item').forEach((el, i) => {
                const bInfo = (evt.badges[i].langs && (evt.badges[i].langs[state.lang] || evt.badges[i].langs['zh-hant'])) || info.items[i] || { name: '?', rule: '' };
                el.querySelector('.em-badge-name').textContent = bInfo.name;
                el.querySelector('.em-badge-rule').textContent = bInfo.rule;
                el.querySelector('.em-badge-rule').title = bInfo.rule; 
            });

            const btn = document.getElementById('em-cta-btn');
            btn.textContent = isActive ? t.em_btn_active : t.em_btn_soon;
            btn.className = `em-cta-btn ${isActive ? 'em-btn-active' : 'em-btn-disabled'}`;
            btn.onclick = isActive && evt.eventUrl ? () => { 
                const finalUrl = evt.eventUrl.replace('{UID}', uid || '');
                window.open(finalUrl, '_blank'); 
            } : null;

            document.getElementById('event-modal-overlay').classList.add('show');
            if (!isInIframe) document.body.style.overflow = 'hidden';
        }

        function closeEventModal() {
            document.getElementById('event-modal-overlay').classList.remove('show');
            if (!isInIframe) document.body.style.overflow = '';
        }

        function renderUpcomingBanner() {
            const container = document.getElementById('upcoming-alert-container');
            const t = I18N[state.lang];
            const now = new Date();

            const valid = UPCOMING_BADGE_DB.filter(e => now <= new Date(e.endDate + 'T23:59:59'));
            if (valid.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }

            valid.sort((a, b) => {
                const aAct = now >= new Date(a.startDate) && now <= new Date(a.endDate + 'T23:59:59');
                const bAct = now >= new Date(b.startDate) && now <= new Date(b.endDate + 'T23:59:59');
                if (aAct !== bAct) return aAct ? -1 : 1;
                return new Date(a.startDate) - new Date(b.startDate);
            });

            const evt = valid[0];
            const info = evt.langs[state.lang] || evt.langs['zh-hant'];
            const start = new Date(evt.startDate);
            const isActive = now >= start && now <= new Date(evt.endDate + 'T23:59:59');
            const daysUntil = Math.ceil((start - now) / 86400000);

            let statusText = isActive ? t.uc_active : (daysUntil > 0 ? t.uc_days_pre + daysUntil + t.uc_days_suf : t.uc_soon);
            const tagText = isActive ? t.ub_tag_active : t.ub_tag_soon;
            const dateStr = formatShortDateRange(evt.startDate, evt.endDate);
            const badgeCount = evt.badges.length;

            const previewBadges = evt.badges.slice(0, 3);
            let imagesHtml = '<div class="ub-img-stack">';
            previewBadges.forEach((b, i) => {
                const inner = b.preview
                    ? `<img class="ub-img" src="${CFG.img}${b.imgId}.svg" onerror="handleImgFallback(this)">`
                    : `<div class="ub-mystery">?</div>`;
                imagesHtml += `<div class="ub-img-wrap" style="z-index: ${3-i}">${inner}</div>`;
            });
            imagesHtml += '</div>';

            container.innerHTML = `
                <div class="upcoming-banner ${isActive ? '' : 'is-locked'}" onclick="openEventModal('${evt.id}')">
                    <div class="ub-content">
                        <span class="ub-new-tag">${tagText}</span>
                        <div class="ub-title-row">
                            <div class="ub-status-dot"></div>
                            <span class="ub-status-text">${statusText}</span>
                            <span class="ub-event-name"></span>
                        </div>
                        <div class="ub-meta">
                            <span class="ub-date">📅 ${dateStr}</span>
                            ${badgeCount > 1 ? `<span class="ub-badge-count">· ${badgeCount} 款徽章</span>` : ''}
                        </div>
                        <span class="ub-hint">${t.ub_hint}</span>
                    </div>
                    <div class="ub-images">
                        ${imagesHtml}
                        <span class="ub-chevron">›</span>
                    </div>
                </div>`;

            container.querySelector('.ub-event-name').textContent = info.eventTitle;
            container.style.display = 'block';
        }

        function setLang(l) {
            state.lang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === `btn-${l}`));
            document.documentElement.lang = l === 'zh-hant' ? 'zh-Hant' : 'en';
            document.title = l === 'zh-hant' ? '帳號徽章更換 | SWAG Premium' : 'Badge Manager | SWAG Premium';
            updateUIStrings();
            renderUpcomingBanner();
            if (uid) {
                if (state.dataLoaded && !state.isLoading) {
                    const box = document.getElementById('display');
                    box.classList.add('lang-loading'); box.classList.remove('lang-loaded');
                    rebuildTranslations().then(() => { box.classList.remove('lang-loading'); box.classList.add('lang-loaded'); });
                } else if (!state.isLoading) { init(); }
            }
        }

        function updateUIStrings() {
            const t = I18N[state.lang];
            const ids = {
                'lbl-my-lvl': t.my_lvl, 'ui-upgrade': t.upgrade, 'lbl-total': t.total,
                'lbl-site-lib': t.all_lib, 'lbl-view-lib': t.view_lib, 'ui-title': t.title,
                'ui-all-title': t.all_title, 'ui-feat-h': t.feat_h, 'ui-vip-pre': t.vip_pre,
                'ui-vip-lvl': t.vip_lvl, 'ui-vip-suf': t.vip_suf, 'ui-hint-pos': t.hint_pos,
                'lbl-count-pre': t.count_pre, 'lbl-count-suf': t.count_suf,
                'ui-zero-msg': t.zero_msg, 'ui-zero-cta': t.zero_cta,
                'flt-all': t.flt_all, 'flt-owned': t.flt_owned, 'flt-unowned': t.flt_unowned,
                'ui-modal-btn': t.modal_btn,
                'sp-lbl-1': t.sp_send, 'sp-lbl-2': t.sp_processing, 'sp-lbl-3': t.sp_confirm,
            };
            Object.entries(ids).forEach(([id, text]) => { const el = document.getElementById(id); if (el) el.innerText = text; });
            for (let i = 1; i <= 7; i++) { const el = document.getElementById(`ui-n${i}`); if (el) el.innerText = t[`n${i}`]; }
        }

        async function init(isRefreshOnly = false) {
            if (state.isLoading) return;
            state.isLoading = true;
            const box = document.getElementById('display');
            const hero = document.getElementById('zero-badge-hero');
            const instArea = document.getElementById('ui-instruction');
            const mgmtArea = document.getElementById('management-area');

            if (!uid) {
                box.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:100px;color:#444">${I18N[state.lang].login}</div>`;
                state.isLoading = false; return;
            }

            if (!isRefreshOnly) {
                box.innerHTML = Array(4).fill(0).map(() =>
                    `<div class="badge-item"><div class="badge-img skeleton" style="border-radius:50%"></div><div class="skeleton" style="height:14px;width:70%;margin-top:8px"></div><div class="skeleton" style="height:12px;width:45%;margin-top:6px"></div></div>`
                ).join('');
            }

            try {
                const r = await fetch(`${CFG.data}?user_id=${uid}`).then(res => res.json());
                state.level = r.level; state.dataLoaded = true; state.username = r.username || '---';
                document.getElementById('ui-count').innerText = r.count;
                document.getElementById('ui-level').innerText = r.level;
                document.getElementById('ui-username-display').innerText = I18N[state.lang].username + state.username;
                const rawIds = (r.badges || []).filter(i => i.startsWith('campaign_'));
                state.ownedIds = rawIds;
                state.list = await Promise.all(rawIds.map(async id => ({ id, name: await fetchBadgeName(id, state.lang) })));
                if (rawIds.length === 0) { hero.style.display = 'block'; box.style.display = 'none'; instArea.style.display = 'none'; mgmtArea.style.display = 'none'; }
                else { hero.style.display = 'none'; box.style.display = 'grid'; }
                if (rawIds.length > 0) {
                    mgmtArea.style.display = 'block';
                    const lastId = rawIds[rawIds.length - 1];
                    const secondLastId = rawIds.length > 1 ? state.ownedIds[state.ownedIds.length - 2] : null;
                    const eqList = [];
                    if (secondLastId) eqList.push({ id: secondLastId, name: findNameInList(secondLastId) });
                    eqList.push({ id: lastId, name: findNameInList(lastId) });
                    renderEquippedGrid(eqList);
                }
                if (state.list.length > 0) render();
                check();
            } catch (e) {
                const t = I18N[state.lang];
                box.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#64748b;font-weight:700">${t.err_load}</div>`;
                mgmtArea.style.display = 'none'; instArea.style.display = 'none'; hero.style.display = 'none';
            } finally { state.isLoading = false; }
        }

        function toggleAllBadges(show) {
            const overlay = document.getElementById('all-badges-overlay');
            if (show) {
                overlay.style.display = 'flex';
                if (!isInIframe) { document.body.style.overflow = 'hidden'; document.body.style.position = 'fixed'; document.body.style.width = '100%'; }
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('flt-all').classList.add('active');
                renderLibrary('all');
            } else {
                overlay.style.display = 'none';
                if (!isInIframe) { document.body.style.overflow = ''; document.body.style.position = ''; document.body.style.width = ''; }
            }
        }

        function renderLibrary(filterType, btnElem = null) {
            state.currentFilter = filterType;
            if (btnElem) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btnElem.classList.add('active'); }
            const list = document.getElementById('all-badges-list');
            const t = I18N[state.lang];
            let filteredHTML = '';
            Object.entries(GLOBAL_BADGE_DB).forEach(([id, langData]) => {
                const info = langData[state.lang] || langData['zh-hant'];
                const isOwned = info.matchPrefix ? state.ownedIds.some(ownedId => ownedId.startsWith(info.matchPrefix)) : state.ownedIds.includes(id);
                if (filterType === 'owned' && !isOwned) return;
                if (filterType === 'unowned' && isOwned) return;
                const renderImg = info.imgId || id;
                let descText = info.desc; let dateHtml = '';
                const dateMatch = descText.match(/\s*\((20\d{2}[^)]*)\)$/);
                if (dateMatch) { descText = descText.replace(dateMatch[0], ''); dateHtml = `<div class="lib-date">🗓 ${dateMatch[1]}</div>`; }
                filteredHTML += `<div class="lib-card ${isOwned ? 'owned' : ''}"><img class="lib-img" src="${CFG.img}${renderImg}.svg" onerror="if(!this.src.includes('default'))this.src='${CFG.img}default.svg'"><div class="lib-info"><div class="lib-header-row"><span class="lib-name">${info.title}</span>${isOwned ? `<span class="owned-tag">${t.got_it}</span>` : ''}</div><span class="lib-subtitle">${info.sub}</span><span class="lib-desc">${descText}</span>${dateHtml}</div></div>`;
            });
            if (filteredHTML === '') filteredHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;font-size:15px;font-weight:bold">${t.empty_lib}</div>`;
            list.innerHTML = filteredHTML;
        }

        function render() {
            const t = I18N[state.lang]; const box = document.getElementById('display');
            box.innerHTML = state.list.map(b => {
                const isSelected = state.selected?.id === b.id;
                const btnHtml = (state.level >= 60 && isSelected)
                    ? `<button class="inline-confirm-btn ${state.isSubmitting ? 'submitting' : ''}" onclick="sendReq(event)">${state.isSubmitting ? t.sending : t.btn}</button>`
                    : '';
                return `<div class="badge-item ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${b.id}')"><img class="badge-img" src="${CFG.img}${b.id}.svg" onerror="if(!this.src.includes('default'))this.src='${CFG.img}default.svg'"><span class="badge-name"></span>${btnHtml}</div>`;
            }).join('');
            box.querySelectorAll('.badge-name').forEach((el, i) => { el.textContent = state.list[i].name; });
        }

        function toggleSelect(id) {
            if (state.isSubmitting) return;
            const badge = state.list.find(b => b.id === id);
            state.selected = (state.selected && state.selected.id === id) ? null : badge;
            render(); check();
        }

        function check() {
            const t = I18N[state.lang];
            const card = document.getElementById('status-card');
            const authStatus = document.getElementById('ui-auth-status');
            const upgradeBtn = document.getElementById('ui-upgrade');
            const instArea = document.getElementById('ui-instruction');
            const hintLbl = document.getElementById('ui-hint-label');
            const hintVal = document.getElementById('ui-hint-value');
            if (state.level >= 60) {
                if (card) card.classList.add('vip-active');
                if (authStatus) { authStatus.innerText = t.ok; authStatus.className = 'val-status unlocked'; }
                if (upgradeBtn) upgradeBtn.style.display = 'none';
                if (state.list.length > 0) instArea.style.display = 'block';
                if (state.selected) { hintLbl.innerText = t.hint_ready; hintVal.textContent = state.selected.name; hintVal.className = 'hint-value hint-selected'; }
                else { hintLbl.innerText = t.hint_sel; hintVal.innerText = '---'; hintVal.className = 'hint-value'; }
            } else {
                if (card) card.classList.remove('vip-active');
                if (authStatus) { authStatus.innerText = t.lock; authStatus.className = 'val-status'; }
                if (upgradeBtn) upgradeBtn.style.display = 'inline-block';
                instArea.style.display = 'none';
            }
        }

        function setSwapProgress(step) {
            const bar = document.getElementById('swap-progress'); const t = I18N[state.lang];
            document.getElementById('sp-lbl-1').textContent = t.sp_send;
            document.getElementById('sp-lbl-2').textContent = t.sp_processing;
            document.getElementById('sp-lbl-3').textContent = t.sp_confirm;
            if (step === 0 || step === 4) { bar.classList.remove('visible'); return; }
            bar.classList.add('visible');
            for (let i = 1; i <= 3; i++) { const el = document.getElementById(`sp-${i}`); el.classList.remove('active','done'); if (i < step) el.classList.add('done'); else if (i === step) el.classList.add('active'); }
            for (let i = 1; i <= 2; i++) document.getElementById(`sp-line-${i}`).classList.toggle('done', i < step);
        }

        async function pollUntilConfirmed(targetBadgeId, maxAttempts = 8, intervalMs = 2500) {
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(r => setTimeout(r, intervalMs));
                try {
                    const r = await fetch(`${CFG.data}?user_id=${uid}`).then(res => res.json());
                    const rawIds = (r.badges || []).filter(id => id.startsWith('campaign_'));
                    if (rawIds[rawIds.length - 1] === targetBadgeId) return { confirmed: true, data: r };
                } catch { /* continue */ }
            }
            return { confirmed: false };
        }

        function showOptimisticEquipped(pendingId, pendingName) {
            const grid = document.getElementById('equipped-display-grid');
            const boxes = grid.querySelectorAll('.equipped-box');
            if (boxes.length === 0) return;
            const lastBox = boxes[boxes.length - 1];
            if (boxes.length >= 2) {
                const leftBox = boxes[boxes.length - 2];
                const oldSrc = lastBox.querySelector('img').src;
                const oldTxt = lastBox.querySelector('span').textContent;
                const li = leftBox.querySelector('img'); const ls = leftBox.querySelector('span');
                li.style.transition = 'opacity 0.25s'; li.style.opacity = '0';
                ls.style.transition = 'opacity 0.25s'; ls.style.opacity = '0';
                setTimeout(() => { li.src = oldSrc; ls.textContent = oldTxt; li.style.opacity = '1'; ls.style.opacity = '1'; }, 250);
            }
            lastBox.classList.add('pending');
            const img = lastBox.querySelector('img');
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = `${CFG.img}${pendingId}.svg`;
                img.onload = () => { img.style.opacity = '1'; };
                img.onerror = () => { if (!img.src.includes('default')) img.src = `${CFG.img}default.svg`; img.style.opacity = '1'; };
            }, 150);
            lastBox.querySelector('span').textContent = pendingName;
            if (!lastBox.querySelector('.eq-loading-ring')) { const ring = document.createElement('div'); ring.className = 'eq-loading-ring'; lastBox.appendChild(ring); }
        }

        function showEquippedSuccess() {
            const grid = document.getElementById('equipped-display-grid');
            const boxes = grid.querySelectorAll('.equipped-box');
            if (boxes.length === 0) return;
            const lastBox = boxes[boxes.length - 1];
            lastBox.querySelector('.eq-loading-ring')?.remove();
            lastBox.classList.remove('pending'); lastBox.classList.add('eq-confirmed');
            lastBox.addEventListener('animationend', () => lastBox.classList.remove('eq-confirmed'), { once: true });
        }

        async function sendReq(e) {
            if (e) e.stopPropagation();
            if (state.isSubmitting || !state.selected) return;
            const t = I18N[state.lang]; const targetBadge = { ...state.selected };
            state.isSubmitting = true; render();
            showOptimisticEquipped(targetBadge.id, targetBadge.name); setSwapProgress(1);
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const res = await fetch(CFG.handler, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: uid, badge_id: targetBadge.id }), signal: controller.signal
                });
                clearTimeout(timeoutId); const d = await res.json();
                if (!res.ok) { setSwapProgress(0); if (res.status === 429) showModal(t.cooldown); else showModal(`❌: ${d.error || 'Denied'}`); await init(true); return; }
                setSwapProgress(2);
                const result = await pollUntilConfirmed(targetBadge.id);
                setSwapProgress(3); await new Promise(r => setTimeout(r, 400));
                if (result.confirmed) {
                    setSwapProgress(0);
                    state.ownedIds = (result.data.badges || []).filter(i => i.startsWith('campaign_'));
                    state.list = await Promise.all(state.ownedIds.map(async id => ({ id, name: await fetchBadgeName(id, state.lang) })));
                    if (state.ownedIds.length > 0) {
                        const lastId = state.ownedIds[state.ownedIds.length - 1];
                        const secondLastId = state.ownedIds.length > 1 ? state.ownedIds[state.ownedIds.length - 2] : null;
                        const eqList = [];
                        if (secondLastId) eqList.push({ id: secondLastId, name: findNameInList(secondLastId) });
                        eqList.push({ id: lastId, name: findNameInList(lastId) });
                        renderEquippedGrid(eqList);
                    }
                    showEquippedSuccess(); showModal(t.success_confirmed); state.selected = null; render(); check();
                } else { setSwapProgress(0); showModal(t.success_pending); await init(true); }
            } catch (err) {
                setSwapProgress(0);
                if (err.name === 'AbortError') showModal(t.err_timeout); else showModal('❌ 伺服器連線失敗 (Network Error)');
                await init(true);
            } finally { state.isSubmitting = false; render(); check(); }
        }

        // 初始化
        document.getElementById('ui-total-db-count').innerText = Object.keys(GLOBAL_BADGE_DB).length;
        setupPwaLinkInterceptor();
        setLang('zh-hant');
        if (uid) init();
    </script>
</body>
</html>
