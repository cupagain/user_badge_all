<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>帳號徽章更換 | SWAG Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #191919;
            --surface-container: #232323;
            --outline: #474747;
            --pink: #F6418D;
            --gold: #FFD100;
            --primary: #00D2BE;
            --info: #60C4E8;
            --success-green: #15EA48;
            --font-head: 'PingFang TC', 'Outfit', sans-serif;
            --font-body: 'PingFang TC', 'Inter', sans-serif;
            --text-primary: #FFFFFF;
            --text-secondary: #C8C8C8;
            --text-dim: #9B9B9B;
            --glass-deep: rgba(35,35,35,0.95);
            --glass-border: rgba(255,255,255,0.15);
            --glass-border-subtle: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-primary); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes dot-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        @keyframes mystery-glow { 0%,100%{ box-shadow: 0 0 8px rgba(246,65,141,0.3), inset 0 0 8px rgba(246,65,141,0.1); } 50%{ box-shadow: 0 0 20px rgba(246,65,141,0.6), inset 0 0 12px rgba(246,65,141,0.2); } }
        @keyframes successPulse { 0%{ box-shadow:0 0 0 0 rgba(255,209,0,.7),0 8px 20px rgba(0,0,0,.4);border-color:var(--gold);} 50%{box-shadow:0 0 0 12px rgba(255,209,0,0),0 8px 20px rgba(0,0,0,.4);border-color:var(--gold);} 100%{box-shadow:0 8px 20px rgba(0,0,0,.4);border-color:var(--glass-border-subtle);} }

        /* ── HEADER ── */
        .header-area { text-align: center; padding: 28px 16px 0; }
        /* 主標題：同設計但降低重量（字級 22px、字重 800、shimmer 放慢）*/
        .main-title {
            font-family: var(--font-head); font-size: 22px; font-weight: 800;
            letter-spacing: -0.5px; margin-bottom: 12px;
            background: linear-gradient(90deg, rgba(255,255,255,0.85) 0%, rgba(200,200,200,0.65) 30%, rgba(255,255,255,0.85) 60%, rgba(200,200,200,0.65) 90%, rgba(255,255,255,0.85) 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 6s linear infinite;
        }
        /* 帳號資訊區：藍色邊框 pill 包住帳號 + 徽章總數，統一感 */
        .account-badge-block {
            display: inline-flex; align-items: center; gap: 10px;
            border: 1px solid rgba(96,196,232,0.4); background: rgba(96,196,232,0.05);
            padding: 8px 20px; border-radius: 100px; margin-bottom: 18px;
        }
        .ab-username { font-size: 13px; font-weight: 700; color: var(--gold); }  /* 金色：帳號是用戶身份識別，金色傳遞歸屬感 */
        .ab-divider { width: 1px; height: 14px; background: rgba(96,196,232,0.3); flex-shrink: 0; }
        .ab-count-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .ab-count-val { font-family: var(--font-head); font-size: 16px; font-weight: 800; color: var(--info); line-height: 1; }

        /* ── TOP NAV ── */
        .top-nav { display: flex; justify-content: center; gap: 8px; margin-top: 32px; }
        .lang-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: var(--text-dim); padding: 0 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .lang-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 700; }

        /* ── UPCOMING BANNER：重設計以「獎勵為主軸」── */
        .upcoming-alert-wrap { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; display: none; }
        .upcoming-banner {
            border-radius: 20px; padding: 14px 14px 14px 16px;
            display: flex; align-items: center; gap: 14px;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            position: relative; overflow: hidden;
            background: var(--surface-container);
            border: 1px solid rgba(246,65,141,0.35);
            box-shadow: 0 0 0 1px rgba(246,65,141,0.08) inset, 0 6px 20px rgba(0,0,0,0.3);
        }
        .upcoming-banner.is-locked { border-color: rgba(255,209,0,0.3); box-shadow: 0 0 0 1px rgba(255,209,0,0.06) inset, 0 6px 20px rgba(0,0,0,0.3); }
        .upcoming-banner:active { transform: scale(0.99); opacity: 0.9; }

        /* 左側：獎勵圖示區 */
        .ub-reward-zone { display: flex; align-items: center; flex-shrink: 0; }
        .ub-slot-wrap { display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0; }
        .ub-badge-slot {
            width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; position: relative;
            overflow: hidden;
        }
        .ub-badge-slot.has-img { background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.12); }
        .ub-badge-slot.is-mystery {
            background: linear-gradient(135deg, rgba(246,65,141,0.18) 0%, rgba(246,65,141,0.05) 100%);
            border: 1.5px solid rgba(246,65,141,0.45);
            animation: mystery-glow 2.5s ease-in-out infinite;
        }
        .is-locked .ub-badge-slot.is-mystery {
            background: linear-gradient(135deg, rgba(255,209,0,0.15) 0%, rgba(255,209,0,0.04) 100%);
            border-color: rgba(255,209,0,0.4);
            animation: none;
        }
        .ub-badge-slot img { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
        .ub-mystery-q { font-family: var(--font-head); font-size: 26px; font-weight: 900; color: var(--pink); line-height: 1; }
        .is-locked .ub-mystery-q { color: var(--gold); }
        /* 標籤移到圖示下方，不再遮住徽章 */
        .ub-slot-label {
            font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px;
            color: var(--pink); opacity: 0.85; white-space: nowrap;
        }
        .is-locked .ub-slot-label { color: var(--gold); }
        .ub-slot-label.owned-label { color: var(--success-green); }

        /* 右側：資訊區 */
        .ub-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .ub-reward-headline {
            font-size: 11px; font-weight: 800; color: var(--pink);
            display: flex; align-items: center; gap: 5px; letter-spacing: 0.3px;
        }
        .is-locked .ub-reward-headline { color: var(--gold); }
        .ub-live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 5px var(--pink); animation: dot-pulse 2s ease-in-out infinite; flex-shrink: 0; }
        .is-locked .ub-live-dot { background: var(--gold); box-shadow: 0 0 5px var(--gold); animation: none; }
        .ub-event-name { font-family: var(--font-head); font-size: 17px; font-weight: 900; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .ub-bottom-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ub-date { font-size: 11px; font-weight: 600; color: var(--text-dim); }
        .ub-badge-count-chip {
            font-size: 10px; font-weight: 700; color: var(--pink);
            background: rgba(246,65,141,0.12); border: 1px solid rgba(246,65,141,0.25);
            padding: 1px 6px; border-radius: 4px;
        }
        .is-locked .ub-badge-count-chip { color: var(--gold); background: rgba(255,209,0,0.1); border-color: rgba(255,209,0,0.25); }
        .ub-more-arrow { color: var(--text-dim); font-size: 16px; flex-shrink: 0; margin-left: auto; }
        .ub-badge-main-name {
            font-family: var(--font-head); font-size: 17px; font-weight: 900;
            color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.2;
        }
        /* 多徽章時的橫排 slot 組 */
        .ub-multi-slots { display:flex;align-items:flex-start;gap:8px;flex-shrink:0; }
        .upcoming-banner.is-owned { border-color:rgba(21,234,72,0.4);box-shadow:0 0 0 1px rgba(21,234,72,0.08) inset,0 6px 20px rgba(0,0,0,.3); }
        .ub-reward-headline.owned-state { color:var(--success-green); }

        /* ── HERO LIBRARY ── */
        .hero-banner-wrap { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; }
        .library-hero-card { background: linear-gradient(135deg, rgba(255,209,0,0.14) 0%, rgba(255,209,0,0.02) 100%); border: 1px solid rgba(255,209,0,0.3); border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s; position: relative; overflow: hidden; }
        .library-hero-card:active { transform: scale(0.98); }
        .library-hero-card::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent); transform: rotate(45deg); animation: shimmer 3s infinite; pointer-events: none; }
        .lh-info { text-align: left; }
        .lh-title { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 4px; display: block; }
        .lh-desc { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .lh-count { font-family: var(--font-head); font-size: 24px; font-weight: 900; color: #fff; display: flex; align-items: baseline; gap: 4px; }
        .lh-count-text { font-size: 12px; font-weight: 600; color: var(--text-dim); font-family: var(--font-body); }
        .lh-arrow { font-size: 14px; color: var(--gold); opacity: 0.8; margin-left: 4px; }

        /* ── EVENT MODAL ── */
        .event-modal-overlay { position: fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,.85); backdrop-filter:blur(14px); z-index:25000; display:none; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity .25s; cursor:pointer; }
        .event-modal-overlay.show { display:flex; opacity:1; }
        .em-content { background:linear-gradient(180deg,var(--surface-container) 0%,var(--bg) 100%); border:1px solid var(--glass-border); border-radius:24px; width:100%; max-width:360px; cursor:default; box-shadow:0 30px 60px rgba(0,0,0,.7); overflow:hidden; position:relative; }
        .em-header { padding:24px 20px 0; text-align:center; position:relative; }
        .em-close { position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10; }
        .em-close:hover { background:rgba(255,255,255,.15);color:#fff; }
        .em-status-badge { display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:13px;font-weight:900;letter-spacing:.5px; }
        .em-status-badge.active { background:rgba(246,65,141,.15);color:var(--pink);border:1px solid rgba(246,65,141,.3); }
        .em-status-badge.locked { background:rgba(255,209,0,.12);color:var(--gold);border:1px solid rgba(255,209,0,.25); }
        .em-status-dot { width:6px;height:6px;border-radius:50%;background:currentColor; }
        .em-body { padding:16px 16px;max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px; }
        .em-badge-item { display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border-subtle);border-radius:14px;padding:14px; }
        /* section label: 改為小型標籤，不浪費空間 */
        .em-section-label { font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:0 2px;text-align:left; }
        .em-badge-img-box { width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.3) inset; }
        .em-badge-img-box img { width:50px;height:50px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
        .em-badge-mystery { font-family:var(--font-head);font-size:32px;font-weight:900;color:var(--text-secondary); }
        .em-badge-info { flex:1;min-width:0;text-align:left; }
        .em-badge-name { font-size:16px;font-weight:900;color:var(--gold);margin-bottom:6px;letter-spacing:.5px; }
        .em-badge-rule { font-size:12px;font-weight:400;color:var(--text-secondary);line-height:1.5; }
        .em-footer { padding:0 16px 20px; }
        .em-cta-btn { display:block;width:100%;min-height:48px;padding:15px 0;border-radius:12px;font-size:16px;font-weight:900;text-align:center;text-decoration:none;border:none;cursor:pointer;font-family:var(--font-body);transition:opacity .2s,transform .15s; }
        .em-btn-active { background:var(--pink);color:#fff;box-shadow:0 4px 16px rgba(246,65,141,.35); }
        .em-btn-active:active { transform:scale(.98); }
        .em-btn-disabled { background:var(--outline);color:var(--text-secondary);cursor:default; }

        /* ── MANAGEMENT ── */
        .management-section { max-width:600px;margin:0 auto 20px;padding:0 16px; }
        .management-card { background:var(--glass-deep);border:1px solid var(--glass-border);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 25px rgba(0,0,0,.3);transition:border-color .3s; }
        .management-card.vip-active { border-color:rgba(255,209,0,.3); }
        .mc-header { text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center; }
        .mc-title { font-size:18px;font-weight:800;color:#fff;letter-spacing:1px;font-family:var(--font-head); }
        .ac-rule-top { font-size:12px;color:var(--text-secondary);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--glass-border-subtle);border:1px solid var(--glass-border-subtle);padding:6px 16px;border-radius:100px;margin-bottom:2px; }
        .lvl-highlight { color:var(--gold);font-family:var(--font-head);font-weight:900;font-size:14px; }
        .equipped-grid { display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px; }
        .equipped-box {
            background:rgba(255,255,255,.02);border:1px solid var(--glass-border-subtle);
            border-radius:24px;padding:24px 10px 14px;
            display:flex;flex-direction:column;align-items:center;text-align:center;
            width:calc(50% - 8px);max-width:180px;
            /* 移除外層深色陰影：在深色背景下視覺差異極小，且在圖片載入前會形成黑色方塊 */
            box-shadow:inset 0 1px 0 rgba(255,209,0,0.45);
            position:relative;transition:opacity .4s,border-color .4s,box-shadow .4s;
        }
        .equipped-box img { width:72px;height:72px;margin-bottom:12px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));position:relative;z-index:2;transition:opacity .3s; }
        .equipped-box span { font-size:13px;font-weight:700;color:#fff;line-height:1.2;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 2px 4px rgba(0,0,0,.6);position:relative;z-index:2; }
        .equipped-box.pending { opacity:.6;border-color:rgba(255,209,0,.5);box-shadow:inset 0 1px 0 rgba(255,209,0,.15); }
        .eq-loading-ring { position:absolute;inset:4px;border-radius:20px;z-index:10;border:2px solid transparent;border-top-color:var(--gold);border-right-color:rgba(255,209,0,.3);animation:spin 1s linear infinite;pointer-events:none; }
        .equipped-box.eq-confirmed { opacity:1!important;animation:successPulse .9s ease-out forwards; }
        .mc-divider { height:1px;background:linear-gradient(90deg,transparent,var(--glass-border),transparent);margin:0 8px; }
        .mc-vip-area { display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex-wrap:wrap;gap:12px; }
        .ac-my-lvl { font-size:14px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:8px; }
        .val-lvl-plain { font-family:var(--font-head);font-size:20px;color:var(--gold);line-height:1;font-weight:900; }
        .ac-status-area { display:flex;align-items:center;gap:12px; }
        .val-status { font-size:14px;font-weight:800;color:var(--text-dim); }
        .val-status.unlocked { color:var(--gold); }
        .upgrade-cta-inline { background:var(--pink);color:#fff;font-size:12px;font-weight:800;padding:0 14px;border-radius:8px;text-decoration:none;display:none;box-shadow:0 4px 10px rgba(246,65,141,.3);white-space:nowrap;min-height:40px;line-height:40px;box-sizing:border-box;text-align:center; }
        .swap-progress-bar { display:none;align-items:center;justify-content:center;gap:8px;padding:10px 0 4px;font-size:11px;font-weight:700;color:var(--text-dim); }
        .swap-progress-bar.visible { display:flex; }
        .sp-step { display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.35;transition:opacity .4s; }
        .sp-step.active { opacity:1;color:var(--gold); }
        .sp-step.done { opacity:.6;color:var(--success-green); }
        .sp-dot { width:8px;height:8px;border-radius:50%;background:currentColor; }
        .sp-line { width:24px;height:2px;background:var(--glass-border);border-radius:1px;align-self:center;margin-bottom:12px; }
        .sp-line.done { background:var(--success-green); }

        /* ── INSTRUCTION ── */
        .instruction-area { text-align:center;margin-bottom:12px;min-height:48px;padding:0 20px; }
        .hint-label { font-size:11px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:4px;text-transform:uppercase; }
        .hint-pos-warn { font-size:11px;font-weight:600;color:var(--gold);opacity:.8;margin-top:4px;display:block;margin-bottom:6px; }
        .hint-value { font-size:16px;font-weight:800;color:#fff;display:block; }
        .hint-selected { color:var(--info); }

        /* ── BADGE GRID ── */
        .badge-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 30px;max-width:1000px;margin:0 auto; }
        @media(min-width:768px){ .badge-grid { grid-template-columns:repeat(auto-fit,180px); justify-content:center; } }
        .badge-item { background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:16px;padding:28px 10px 10px;text-align:center;cursor:pointer;position:relative;transition:border-color .3s,background .3s,transform .3s;display:flex;flex-direction:column;align-items:center;height:100%;min-height:160px; }
        .badge-item.selected { border-color:var(--gold);background:var(--surface-container);transform:scale(1.02); }
        .badge-item.selected::after { content:'✓';position:absolute;top:12px;right:14px;color:var(--gold);font-weight:900;font-size:18px; }
        .badge-img { width:72px;height:72px;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));pointer-events:none; }
        .badge-name { font-size:13px;font-weight:700;color:#f1f5f9;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;pointer-events:none;margin-bottom:5px; }
        .inline-confirm-btn { background:var(--gold);color:#000;border:none;padding:8px 0;width:90%;border-radius:8px;font-family:var(--font-head);font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(255,209,0,.4);animation:fadeIn .3s ease forwards;margin-top:auto;min-height:40px; }
        .inline-confirm-btn.submitting { opacity:.7;cursor:wait;filter:grayscale(.5); }
        .badge-grid.lang-loading { opacity:.4;pointer-events:none; }
        .badge-grid.lang-loaded { opacity:1; }

        /* ── ZERO STATE ── */
        .zero-badge-hero { max-width:600px;margin:30px auto;padding:40px 20px;text-align:center;background:rgba(255,255,255,.02);border:1px solid var(--glass-border);border-radius:16px;backdrop-filter:blur(10px); }
        .zero-badge-hero p { font-size:15px;font-weight:700;color:var(--text-dim);margin-bottom:20px; }
        .hero-btn { background:rgba(255,255,255,.1);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;border:1px solid var(--glass-border);cursor:pointer;transition:background .3s;min-height:40px; }

        /* ── FOOTER ── */
        .footer { max-width:600px;margin:40px auto 0;padding:24px 20px 80px;border-top:1px solid var(--glass-border); }
        .notice-list { list-style:none;padding:0; }
        .notice-item { font-size:12px;color:var(--text-dim);font-weight:600;line-height:1.6;margin-bottom:8px;display:flex;gap:8px;text-align:left;align-items:flex-start; }
        .notice-item::before { content:"•";color:var(--text-dim);font-weight:900;font-size:16px;line-height:1.2;flex-shrink:0;margin-top:1px; }
        .notice-alert { color:var(--pink)!important;font-weight:800!important; }

        /* ── OVERLAY ── */
        .full-overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.98);backdrop-filter:blur(20px);z-index:15000;display:none;flex-direction:column;overflow:hidden;animation:fadeIn .2s ease; }
        .overlay-header { padding:24px 16px 16px;text-align:center;position:relative;flex-shrink:0; touch-action: none; }
        .overlay-title { font-family:var(--font-head);font-size:20px;font-weight:900;color:#fff; }
        .close-overlay { position:absolute;right:12px;top:12px;font-size:24px;color:var(--text-dim);cursor:pointer;border:none;background:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%; }
        .close-overlay:hover { color:#fff;background:rgba(255,255,255,.08); }
        .overlay-filters { display:flex;justify-content:center;gap:8px;padding:0 16px 15px;border-bottom:1px solid var(--glass-border);flex-shrink:0;flex-wrap:wrap; touch-action: none; }
        .filter-btn { background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--text-dim);padding:8px 20px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,color .2s;min-height:40px; }
        .filter-btn.active { background:var(--gold);color:#000;border-color:var(--gold); }
        .overlay-scroll {
            flex:1; min-height:0;
            overflow-y:scroll;
            /* 修改這裡：將 bottom padding 從 32px 加大到 80px，並加上底部安全邊界 */
            padding: 14px 16px calc(80px + env(safe-area-inset-bottom));
            -webkit-overflow-scrolling:touch;
            overscroll-behavior:contain;
            touch-action: pan-y; 
        }
        /* 確保所有子元素都將垂直滑動路由到 overlay-scroll，而非各自建立獨立觸控上下文 */
        .overlay-scroll * { touch-action: pan-y; }

        /* ── LIBRARY：分組 + 統一容器設計 ── */
        .lib-grid { display:flex;flex-direction:column;gap:8px; }

        /* 整個群組是一個容器，header 與 body 同屬其中，展開後渾然一體 */
        .lib-group {
            border:1px solid var(--glass-border);border-radius:16px;
            /* overflow:hidden 已移除：在 iOS WebKit iframe 中，overflow:hidden 子元素會創造觸控滑動邊界，
               導致 iOS 將觸控事件路由到不同的滾動上下文，造成「上下兩個區域分開滑動」的現象。
               改為對子元素直接設定 border-radius 來維持視覺圓角 */
            transition:border-color .3s;
        }
        .lib-group.is-complete { border-color:rgba(255,209,0,.3); }

        .lib-group-header {
            display:flex;justify-content:space-between;align-items:center;
            padding:12px 14px;
            background:rgba(255,255,255,.04);
            cursor:pointer;transition:background .2s;user-select:none;
            /* 預設所有角都圓（群組收合時 header 是唯一可見子元素）*/
            border-radius:15px;
        }
        /* 群組展開時，header 只有上方兩角需要圓 */
        .lib-group.is-open > .lib-group-header { border-radius:15px 15px 0 0; }
        .lib-group-header:active { background:rgba(255,255,255,.07); }
        .lib-group-left { display:flex;flex-direction:column;gap:4px;flex:1;min-width:0; }

        /* 標題 + 日期同一行 */
        .lib-group-title-row { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
        .lib-group-title { font-size:14px;font-weight:800;color:var(--text-primary); }
        .lib-group-date { font-size:10px;font-weight:600;color:var(--text-dim);white-space:nowrap; }

        /* 縮圖預覽：grid 自適應換行 */
        .lib-group-thumbs {
            display:grid;
            grid-template-columns:repeat(auto-fill, 48px);
            gap:6px;margin-top:6px;
        }
        .lib-group-thumbs.hidden { display:none; }
        .lib-thumb {
            width:48px;height:48px;border-radius:8px;
            background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.1);
            display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
        }
        .lib-thumb img { width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
        .lib-thumb.owned-thumb { border-color:rgba(255,209,0,0.6);box-shadow:0 0 7px rgba(255,209,0,.18); }

        .lib-group-right { display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:12px; }
        .lib-group-count { font-size:12px;font-weight:700;color:var(--text-dim);white-space:nowrap; }
        .lib-group-count.complete { color:var(--success-green); }
        /* CSS border chevron — 不使用任何 emoji 或特殊字元 */
        .lib-group-chevron {
            display:inline-block;flex-shrink:0;
            width:8px;height:8px;
            border-right:2px solid var(--text-dim);
            border-bottom:2px solid var(--text-dim);
            transform:rotate(-45deg); /* 指向右 */
            transition:transform .25s,border-color .2s;
            margin-right:2px;
        }
        .lib-group-chevron.open { transform:rotate(45deg); border-color:var(--text-secondary); } /* 指向下 */

        /* body：與 header 直接相連，中間用分隔線而非間距 */
        .lib-group-body { display:none;flex-direction:column;gap:0; }
        .lib-group-body.open { display:flex;padding-bottom:0; }
        /* 展開時最後一張卡片需要下方圓角（取代 overflow:hidden 的裁切效果） */
        .lib-group-body.open .lib-card:last-child { border-radius:0 0 15px 15px; }

        /* 卡片：無獨立 border-radius，在容器內無縫堆疊 */
        .lib-card {
            background:rgba(255,255,255,.02);
            border-top:1px solid var(--glass-border);
            padding:12px 14px;display:flex;align-items:center;gap:14px;
            transition:background .2s,border-color .2s;
        }
        /* owned：只替換頂部分隔線色調 + 左側金條，不覆蓋全邊框（避免破壞容器設計） */
        .lib-card.owned {
            border-top-color:rgba(255,209,0,.2);
            border-left:3px solid rgba(255,209,0,.55);
            padding-left:11px;
            background:rgba(255,209,0,.03);
        }
        .lib-card.owned .lib-img { filter:drop-shadow(0 4px 12px rgba(255,209,0,.4)); }

        /* 無分組的單一徽章：獨立卡片，有完整 border + border-radius */
        .lib-card-standalone {
            background:rgba(255,255,255,.03);border:1px solid var(--glass-border);
            border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px;
            transition:border-color .3s,background .2s;
        }
        .lib-card-standalone.owned { border-color:rgba(255,209,0,.4);background:rgba(255,209,0,.03); }
        .lib-card-standalone.owned .lib-img { filter:drop-shadow(0 4px 12px rgba(255,209,0,.4)); }

        /* 徽章圖：視覺主角 */
        .lib-img { width:60px;height:60px;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));transition:filter .3s; }
        .lib-info { flex:1;min-width:0;text-align:left; }
        .lib-header-row { display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px; }
        .lib-name { font-size:14px;font-weight:800;color:#fff;line-height:1.3; }

        /* 已獲得確認符號：全部圖鑑模式中顯示，我的成就模式中省略（所有徽章皆已擁有，不需重複）*/
        .lib-check { color:var(--gold);font-size:13px;font-weight:900;line-height:1;flex-shrink:0; }

        /* 未獲得：輕微降低視覺重量以區分，維持可識別性 */
        .lib-card.unowned, .lib-card-standalone.unowned { opacity:0.65; }
        .lib-card.unowned .lib-name, .lib-card-standalone.unowned .lib-name { color:var(--text-secondary); }

        .lib-desc { font-size:11px;font-weight:500;color:var(--text-dim);line-height:1.5;display:block; }
        /* lib-date 使用 token 而非硬編碼 rgba */
        .lib-date { display:inline;font-size:10px;font-weight:600;color:var(--text-dim);opacity:.7;margin-left:4px; }

        /* Modal */
        .modal-overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:20000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .3s;cursor:pointer; }
        .modal-overlay.show { display:flex;opacity:1; }
        .modal-content { background:var(--surface-container);border:1px solid var(--glass-border);border-radius:16px;padding:28px 22px;width:100%;max-width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);cursor:default; }
        .modal-text { font-size:15px;font-weight:600;line-height:1.6;margin-bottom:22px;color:#fff; }
        .modal-btn { background:var(--gold);color:#000;border:none;padding:12px 0;width:100%;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px; }

        .skeleton { background:linear-gradient(90deg,var(--bg) 25%,var(--outline) 50%,var(--bg) 75%);background-size:200% 100%;animation:load 1.5s infinite linear;border-radius:10px; }
    </style>

            // reveal 時才恢復 transition:opacity .4s 讓徽章有淡入效果

            g.querySelectorAll('.equipped-box').forEach((box,i)=>{

                const reveal = () => {
                    box.style.transition = 'opacity .4s'; // 恢復動畫僅用於淡入
                    box.style.opacity = '1';
                };
                img.onload = reveal;
                img.onerror = () => {
                    if (!img.src.includes('default')) { img.src = `${CFG.img}default.svg`; }

            if (!rawId) { const p=new URLSearchParams(window.location.search); const s=p.get('source'); if(s) rawId=getFromUrl(s); }

        function renderUpcomingBanner() {
            const container=document.getElementById('upcoming-alert-container');
            const t=I18N[state.lang], now=new Date();
            const valid=UPCOMING_BADGE_DB.filter(e=>now<=new Date(e.endDate+'T23:59:59+08:00'));
            if (valid.length===0) { container.style.display='none'; container.innerHTML=''; return; }
            valid.sort((a,b)=>{ const aA=now>=new Date(a.startDate+'T00:00:00+08:00')&&now<=new Date(a.endDate+'T23:59:59+08:00'), bA=now>=new Date(b.startDate+'T00:00:00+08:00')&&now<=new Date(b.endDate+'T23:59:59+08:00'); if(aA!==bA) return aA?-1:1; return new Date(a.startDate)-new Date(b.startDate); });
            const evt=valid[0], info=evt.langs[state.lang]||evt.langs['zh-hant'];
            const start=new Date(evt.startDate+'T00:00:00+08:00');
            const isActive=now>=start&&now<=new Date(evt.endDate+'T23:59:59+08:00');
            const daysUntil=Math.ceil((start-now)/86400000);
            const dateStr=formatBannerDate(evt.startDate,evt.endDate);
            const badgeCount=evt.badges.length;

            // 判斷已獲得狀態（用 badge items 的 name 反查 ownedIds）
            const ownedBadgeIds=evt.badges.map(b=>b.imgId).filter(id=>state.ownedIds.includes(id));

            const allOwned=ownedCount===badgeCount&&badgeCount>0;

                headlineClass='ub-reward-headline owned-state';

                headlineText=(info.rewardLabel||(state.lang==='zh-hant'?'新徽章系列':'New Badge Series'))+` ${ownedCount}/${badgeCount}`;

                        </div>
                    </div>

                </div>`;
            container.querySelector('.ub-reward-headline span').textContent=headlineText;
            container.querySelector('.ub-badge-main-name').textContent=mainName;

                overlay.style.display='flex';
                if(!isInIframe){
                    document.body.style.overflow='hidden';document.body.style.position='fixed';document.body.style.width='100%';
                } else {
                    // iOS Safari iframe 雙重問題修復：
                    // 1. flex:1 在 position:fixed 容器中高度計算不可靠
                    // 2. 原先的 overflow:hidden 父層限制了子層滾動範圍
                    // 解法：讀取 header + filters 實際高度，對 overlay-scroll 設定明確的像素高度
                    overlay.style.height = window.innerHeight + 'px';
                    const scrollEl = overlay.querySelector('.overlay-scroll');
                    const headerH = overlay.querySelector('.overlay-header').offsetHeight;
                    const filtersH = overlay.querySelector('.overlay-filters').offsetHeight;
                    scrollEl.style.flex = 'none';
                    scrollEl.style.height = (window.innerHeight - headerH - filtersH) + 'px';
                }
                // 更新 tab 顯示：注入數量讓用戶一眼知道各 tab 內容
                const t=I18N[state.lang];
                const totalDB=Object.keys(GLOBAL_BADGE_DB).length;
                const ownedDB=Object.keys(GLOBAL_BADGE_DB).filter(id=>{
                    const info=GLOBAL_BADGE_DB[id][state.lang]||GLOBAL_BADGE_DB[id]['zh-hant'];
                    return info.matchPrefix?state.ownedIds.some(oid=>oid.startsWith(info.matchPrefix)):state.ownedIds.includes(id);
                }).length;
                const fltAll=document.getElementById('flt-all');
                const fltOwned=document.getElementById('flt-owned');
                if(fltAll) fltAll.textContent=`${t.flt_all} (${totalDB})`;
                if(fltOwned) fltOwned.textContent=`${t.flt_owned} (${ownedDB})`;
                document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
                if(fltAll) fltAll.classList.add('active');
                renderLibrary('all');
            } else {
                overlay.style.display='none';
                if(!isInIframe){document.body.style.overflow='';document.body.style.position='';document.body.style.width='';}
                else {
                    overlay.style.height='';
                    const scrollEl = overlay.querySelector('.overlay-scroll');
                    scrollEl.style.flex='';
                    scrollEl.style.height='';
                }
            }
        }

        function renderLibCard(id, langData, t, cssClass='lib-card', groupDate=null) {
            const info=langData[state.lang]||langData['zh-hant'];
            const isOwned=info.matchPrefix
                ?state.ownedIds.some(oid=>oid.startsWith(info.matchPrefix))
                :state.ownedIds.includes(id);
            const renderImg=info.imgId||id;
            let descText=info.desc||'';
            const dateMatch=descText.match(/\s*\((20\d{2}[^)]*)\)$/);
            let inlineDateHtml='';
            if(dateMatch){
                descText=descText.replace(dateMatch[0],'');
                if(!groupDate||dateMatch[1]!==groupDate){
                    inlineDateHtml=`<span class="lib-date">${dateMatch[1]}</span>`;
                }
            }
            // 情境感知：全部圖鑑模式才顯示打勾符號；我的成就模式全部已獲得，不需重複標示
            const statusIndicator=(isOwned&&state.currentFilter==='all')
                ?`<span class="lib-check">✓</span>`:'';
            // 圖片統一全亮，unowned class 只掛在卡片上（由 CSS 透過 opacity 處理整體降亮）
            const cardStatusClass=isOwned?'owned':'unowned';
            return `<div class="${cssClass} ${cardStatusClass}">
                <img class="lib-img" src="${CFG.img}${renderImg}.svg" onerror="if(!this.src.includes('default'))this.src='${CFG.img}default.svg'">
                <div class="lib-info">
                    <div class="lib-header-row">
                        <span class="lib-name">${info.title}</span>
                        ${statusIndicator}
                    </div>
                    <span class="lib-desc">${descText}${inlineDateHtml}</span>
                </div>
            </div>`;
        }

        function toggleLibGroup(groupId) {
            const body=document.getElementById(groupId), chevron=document.getElementById(groupId+'-chevron');
            const thumbs=document.getElementById(groupId+'-thumbs');
            if(!body) return;
            const isOpen=body.classList.contains('open');
            body.classList.toggle('open',!isOpen);
            if(chevron) chevron.classList.toggle('open',!isOpen);
            if(thumbs) thumbs.classList.toggle('hidden',!isOpen);
            // 同步 .lib-group 的 is-open class，供 CSS 根據展開狀態調整 header border-radius
            const group=body.closest('.lib-group');
            if(group) group.classList.toggle('is-open',!isOpen);
        }

        function renderLibGroup(groupName, items, t, filterType='all') {
            const ownedCount=items.filter(([id,langData])=>{const info=langData[state.lang]||langData['zh-hant'];return info.matchPrefix?state.ownedIds.some(oid=>oid.startsWith(info.matchPrefix)):state.ownedIds.includes(id);}).length;
            const total=items.length, isComplete=ownedCount===total&&total>0;
            const groupId='grp-'+encodeURIComponent(groupName);
            const uniformDate=extractGroupUniformDate(items);
            const thumbsHtml=items.map(([id,langData])=>{
                const info=langData[state.lang]||langData['zh-hant'];
                const isOwned=info.matchPrefix?state.ownedIds.some(oid=>oid.startsWith(info.matchPrefix)):state.ownedIds.includes(id);
                const renderImg=info.imgId||id;
                return `<div class="lib-thumb ${isOwned?'owned-thumb':''}"><img src="${CFG.img}${renderImg}.svg" onerror="this.style.display='none'"></div>`;
            }).join('');

            const isOwnedMode=filterType==='owned';
            // 全部模式：顯示進度數字 + chevron；我的成就模式：只顯示 chevron，✅ 由金色左邊框傳達
            const rightHtml=isOwnedMode
                ?`<span class="lib-group-chevron open" id="${groupId}-chevron"></span>`
                :`<span class="lib-group-count ${isComplete?'complete':''}">${ownedCount}/${total}</span><span class="lib-group-chevron" id="${groupId}-chevron"></span>`;
            const defaultOpen=isOwnedMode;
            const headerCursor=isOwnedMode?'style="cursor:default"':'';
            const headerClick=isOwnedMode?'':'onclick="toggleLibGroup(\''+groupId+'\')"';
            return `
            <div class="lib-group ${isComplete?'is-complete':''} ${defaultOpen?'is-open':''}">
                <div class="lib-group-header" ${headerCursor} ${headerClick}>
                    <div class="lib-group-left">
                        <div class="lib-group-title-row">
                            <span class="lib-group-title">${groupName}</span>
                            ${uniformDate?`<span class="lib-group-date">· ${uniformDate}</span>`:''}
                        </div>
                        <div class="lib-group-thumbs ${defaultOpen?'hidden':''}" id="${groupId}-thumbs">${thumbsHtml}</div>
                    </div>
                    <div class="lib-group-right">${rightHtml}</div>
                </div>
                <div class="lib-group-body ${defaultOpen?'open':''}" id="${groupId}">
                    ${items.map(([id,langData])=>renderLibCard(id,langData,t,'lib-card',uniformDate)).join('')}
                </div>
            </div>`;
        }

        // 提取分組統一日期（若分組內所有徽章日期相同，回傳該日期；否則回傳 null）
        function extractGroupUniformDate(items) {
            const dates=items.map(([,langData])=>{
                const info=langData['zh-hant']||Object.values(langData)[0];
                const m=(info.desc||'').match(/\((20\d{2}[^)]*)\)$/);
                return m?m[1]:'';
            }).filter(Boolean);
            if(!dates.length) return null;
            const unique=[...new Set(dates)];
            return unique.length===1?unique[0]:null;
        }

        function renderLibrary(filterType, btnElem=null) {
            state.currentFilter=filterType;
            if(btnElem){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btnElem.classList.add('active');}
            const list=document.getElementById('all-badges-list'), t=I18N[state.lang];

            const entries=Object.entries(GLOBAL_BADGE_DB).filter(([id,langData])=>{
                const info=langData[state.lang]||langData['zh-hant'];
                const isOwned=info.matchPrefix?state.ownedIds.some(oid=>oid.startsWith(info.matchPrefix)):state.ownedIds.includes(id);
                if(filterType==='owned'&&!isOwned) return false;
                if(filterType==='unowned'&&isOwned) return false;
                return true;
            });

            if(entries.length===0){list.innerHTML=`<div style="text-align:center;padding:40px;color:#94a3b8;font-size:14px;font-weight:700">${t.empty_lib}</div>`;return;}

            // 完整 groupMap：有 group 的共用 group key；無 group 的用 id 作唯一 group key
            const groupMap={};
            Object.entries(GLOBAL_BADGE_DB).forEach(([id,langData])=>{
                const info=langData[state.lang]||langData['zh-hant'];
                const grpKey=info.group||id;
                if(!groupMap[grpKey])groupMap[grpKey]=[];
                groupMap[grpKey].push([id,langData]);
            });

            // 依 DB 原始順序：所有徽章（含單一）一律以 group 格式呈現，視覺統一
            const seenGroups=new Set();
            let html='';
            entries.forEach(([id,langData])=>{
                const info=langData[state.lang]||langData['zh-hant'];
                const grpKey=info.group||id;
                if(!seenGroups.has(grpKey)){
                    seenGroups.add(grpKey);
                    const groupItems=(groupMap[grpKey]||[]).filter(([gid,gld])=>{
                        const gi=gld[state.lang]||gld['zh-hant'];
                        const isOwned=gi.matchPrefix?state.ownedIds.some(oid=>oid.startsWith(gi.matchPrefix)):state.ownedIds.includes(gid);
                        if(filterType==='owned'&&!isOwned) return false;
                        if(filterType==='unowned'&&isOwned) return false;
                        return true;
                    });
                    if(groupItems.length>0){
                        const displayName=info.group||info.title;
                        html+=renderLibGroup(displayName,groupItems,t,filterType);
                    }
                }
            });

            list.innerHTML=html;
        }

        function render() {
            const t=I18N[state.lang], box=document.getElementById('display');
            box.innerHTML=state.list.map(b=>{
                const isSelected=state.selected?.id===b.id;
                // 外層 div + 內層 <button>：button 的 onclick 可靠觸發，stopPropagation 阻斷外層 div
                const btnHtml=(state.level>=60&&isSelected)?`<button type="button" class="inline-confirm-btn ${state.isSubmitting?'submitting':''}" onclick="sendReq(event)">${state.isSubmitting?t.sending:t.btn}</button>`:'';
                return `<div class="badge-item ${isSelected?'selected':''}" onclick="toggleSelect(event,'${b.id}')"><img class="badge-img" src="${CFG.img}${b.id}.svg" onerror="if(!this.src.includes('default'))this.src='${CFG.img}default.svg'"><span class="badge-name"></span>${btnHtml}</div>`;
            }).join('');
            box.querySelectorAll('.badge-name').forEach((el,i)=>{el.textContent=state.list[i].name;});
        }

        function toggleSelect(e, id) {
            if(state.isSubmitting) return;
            // 點擊來源是確認按鈕時立即中斷，交由 sendReq 處理
            if(e && e.target && e.target.closest && e.target.closest('.inline-confirm-btn')) return;
            const badge=state.list.find(b=>b.id===id);
            state.selected=(state.selected&&state.selected.id===id)?null:badge;
            render(); check();
        }

        function check() {
            const t=I18N[state.lang], card=document.getElementById('status-card'), authStatus=document.getElementById('ui-auth-status'), upgradeBtn=document.getElementById('ui-upgrade'), instArea=document.getElementById('ui-instruction'), hintLbl=document.getElementById('ui-hint-label'), hintVal=document.getElementById('ui-hint-value');
            if(state.level>=60){
                if(card) card.classList.add('vip-active');
                if(authStatus){authStatus.innerText=t.ok;authStatus.className='val-status unlocked';}
                if(upgradeBtn) upgradeBtn.style.display='none';
                if(state.list.length>0) instArea.style.display='block';
                if(state.selected){hintLbl.innerText=t.hint_ready;hintVal.textContent=state.selected.name;hintVal.className='hint-value hint-selected';}
                else{hintLbl.innerText=t.hint_sel;hintVal.innerText='---';hintVal.className='hint-value';}
            } else {
                if(card) card.classList.remove('vip-active');
                if(authStatus){authStatus.innerText=t.lock;authStatus.className='val-status';}
                if(upgradeBtn) upgradeBtn.style.display='inline-block';
                instArea.style.display='none';
            }
        }

        function setSwapProgress(step) {
            const bar=document.getElementById('swap-progress'), t=I18N[state.lang];
            document.getElementById('sp-lbl-1').textContent=t.sp_send;
            document.getElementById('sp-lbl-2').textContent=t.sp_processing;
            document.getElementById('sp-lbl-3').textContent=t.sp_confirm;
            if(step===0||step===4){bar.classList.remove('visible');return;}
            bar.classList.add('visible');
            for(let i=1;i<=3;i++){const el=document.getElementById(`sp-${i}`);el.classList.remove('active','done');if(i<step)el.classList.add('done');else if(i===step)el.classList.add('active');}
            for(let i=1;i<=2;i++) document.getElementById(`sp-line-${i}`).classList.toggle('done',i<step);
        }

        async function pollUntilConfirmed(targetBadgeId,maxAttempts=8,intervalMs=2500) {
            for(let i=0;i<maxAttempts;i++){
                await new Promise(r=>setTimeout(r,intervalMs));
                try{const r=await fetch(`${CFG.data}?user_id=${uid}`).then(res=>res.json());const rawIds=(r.badges||[]).filter(id=>id.startsWith('campaign_'));if(rawIds[rawIds.length-1]===targetBadgeId)return{confirmed:true,data:r};}catch{}
            }
            return {confirmed:false};
        }

        function showOptimisticEquipped(pendingId,pendingName){const grid=document.getElementById('equipped-display-grid'),boxes=grid.querySelectorAll('.equipped-box');if(boxes.length===0)return;const lastBox=boxes[boxes.length-1];if(boxes.length>=2){const leftBox=boxes[boxes.length-2],oldSrc=lastBox.querySelector('img').src,oldTxt=lastBox.querySelector('span').textContent,li=leftBox.querySelector('img'),ls=leftBox.querySelector('span');li.style.transition='opacity .25s';li.style.opacity='0';ls.style.transition='opacity .25s';ls.style.opacity='0';setTimeout(()=>{li.src=oldSrc;ls.textContent=oldTxt;li.style.opacity='1';ls.style.opacity='1';},250);}lastBox.classList.add('pending');const img=lastBox.querySelector('img');img.style.opacity='0';setTimeout(()=>{img.src=`${CFG.img}${pendingId}.svg`;img.onload=()=>{img.style.opacity='1';};img.onerror=()=>{if(!img.src.includes('default'))img.src=`${CFG.img}default.svg`;img.style.opacity='1';};},150);lastBox.querySelector('span').textContent=pendingName;if(!lastBox.querySelector('.eq-loading-ring')){const ring=document.createElement('div');ring.className='eq-loading-ring';lastBox.appendChild(ring);}}

        function showEquippedSuccess(){const grid=document.getElementById('equipped-display-grid'),boxes=grid.querySelectorAll('.equipped-box');if(boxes.length===0)return;const lastBox=boxes[boxes.length-1];lastBox.querySelector('.eq-loading-ring')?.remove();lastBox.classList.remove('pending');lastBox.classList.add('eq-confirmed');lastBox.addEventListener('animationend',()=>lastBox.classList.remove('eq-confirmed'),{once:true});}

        async function sendReq(e) {
            if(e){e.stopPropagation();e.stopImmediatePropagation();e.preventDefault();}
            if(state.isSubmitting||!state.selected) return;
            const t=I18N[state.lang], targetBadge={...state.selected};
            state.isSubmitting=true; render();
            showOptimisticEquipped(targetBadge.id,targetBadge.name); setSwapProgress(1);
            let skipFinally=false;
            try {
                const controller=new AbortController(), timeoutId=setTimeout(()=>controller.abort(),15000);
                const res=await fetch(CFG.handler,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,badge_id:targetBadge.id}),signal:controller.signal});
                clearTimeout(timeoutId); const d=await res.json();
                if(!res.ok){setSwapProgress(0);if(res.status===429)showModal(t.cooldown);else showModal(`❌: ${d.error||'Denied'}`);await init(true);return;}
                setSwapProgress(2);
                const result=await pollUntilConfirmed(targetBadge.id);
                setSwapProgress(3); await new Promise(r=>setTimeout(r,400));
                if(result.confirmed){
                    setSwapProgress(0);
                    state.ownedIds=(result.data.badges||[]).filter(i=>i.startsWith('campaign_'));
                    state.list=await Promise.all(state.ownedIds.map(async id=>({id,name:await fetchBadgeName(id,state.lang)})));
                    if(state.ownedIds.length>0){const lastId=state.ownedIds[state.ownedIds.length-1],secondLastId=state.ownedIds.length>1?state.ownedIds[state.ownedIds.length-2]:null,eqList=[];if(secondLastId)eqList.push({id:secondLastId,name:findNameInList(secondLastId)});eqList.push({id:lastId,name:findNameInList(lastId)});renderEquippedGrid(eqList);}
                    showEquippedSuccess(); skipFinally=true;
                    setTimeout(()=>{showModal(t.success_confirmed);state.selected=null;state.isSubmitting=false;render();check();},600);
                } else { setSwapProgress(0); showModal(t.success_pending); await init(true); }
            } catch(err) {
                setSwapProgress(0);
                if(err.name==='AbortError') showModal(t.err_timeout); else showModal('❌ 伺服器連線失敗 (Network Error)');
                await init(true);
            } finally { if(!skipFinally){state.isSubmitting=false;render();check();} }
        }
        // --- 解決問題二：徹底阻止在表頭區塊滑動時引發的 iOS Scroll Chaining 鎖死 ---
        const preventScroll = (e) => e.preventDefault();
        const overlayHeader = document.querySelector('.overlay-header');
        const overlayFilters = document.querySelector('.overlay-filters');
        if (overlayHeader) overlayHeader.addEventListener('touchmove', preventScroll, { passive: false });
        if (overlayFilters) overlayFilters.addEventListener('touchmove', preventScroll, { passive: false });
        
        document.getElementById('ui-total-db-count').innerText=Object.keys(GLOBAL_BADGE_DB).length;
        setupPwaLinkInterceptor();
        setLang('zh-hant');
        if(uid) init();
        
    </script>
</body>
</html>
